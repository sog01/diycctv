version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: diycctv-server
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8081}
    restart: unless-stopped
    networks:
      - diycctv-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: diycctv-client
    ports:
      - "${CLIENT_PORT:-8080}:${CLIENT_PORT:-8080}"
    environment:
      - CLIENT_PORT=${CLIENT_PORT:-8080}
      - SERVER_BASE_URL=http://server:${SERVER_PORT:-8081}
      - WEB_SOCKET_URL=ws://localhost:${SERVER_PORT:-8081}/ws
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - diycctv-network

networks:
  diycctv-network:
    driver: bridge