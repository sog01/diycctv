<!DOCTYPE html>
<html>
  <title>Live Streaming</title>
  <body>
    <video id="video" autoplay muted playsinline></video>
    <script>
      ws = new WebSocket("ws://localhost:8080/ws/live")
      ws.onopen = async () => {
        console.log("Requesting Live")
        ws.send(
          JSON.stringify({
            type: "live",
            isLiveStream: true,
          })
        )
      }

      let pc
      const video = document.getElementById("video")

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data)
        if (msg.type === "offer") {
          console.log("Received offer")
          pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
          })
          pc.ontrack = (e) => {
            console.log("Received Tracks")
            video.srcObject = e.streams[0]
          }
          const offer = JSON.parse(msg.payload)
          pc.setRemoteDescription(new RTCSessionDescription(offer))
          const answer = await pc.createAnswer()
          pc.setLocalDescription(answer)

          pc.onnegotiationneeded = () => {
            console.log("ON Negotiation Needed")
          }

          ws.send(
            JSON.stringify({
              type: "live-answer",
              isLiveStream: true,
              payload: JSON.stringify(answer),
            })
          )

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              ws.send(
                JSON.stringify({
                  type: "live-candidate",
                  isLiveStream: true,
                  payload: JSON.stringify(event.candidate.toJSON()),
                })
              )
              console.log("Sent ICE candidate")
            }
          }
          pc.onconnectionstatechange = () => {
            console.log("Connection:", pc.connectionState)
          }
        } else if (msg.type === "answer") {
          console.log("Received answer")
          const answer = JSON.parse(msg.payload)
          await pc.setRemoteDescription(answer)
        } else if (msg.type === "candidate") {
          console.log("Received ICE candidate")
          const candidate = JSON.parse(msg.payload)
          await pc.addIceCandidate(candidate)
        }
      }

      ws.onerror = (error) => {
        console.error("WebSocket error:", error)
        setStatus("WebSocket error", "error")
      }

      ws.onclose = () => {
        console.log("WebSocket closed")
        setStatus("Connection closed", "error")
      }
    </script>
  </body>
</html>
